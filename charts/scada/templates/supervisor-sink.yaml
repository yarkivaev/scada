{{- if .Values.sink.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scada.prefix" . }}-supervisor-sink
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: supervisor-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "scada.match" (dict "app" "supervisor-sink" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        {{- include "scada.match" (dict "app" "supervisor-sink" "ctx" .) | nindent 8 }}
    spec:
      {{- with .Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: supervisor-sink
          image: {{ required "image is required" .Values.image | quote }}
          command: ["node", "node_modules/@yarkivaev/scada/src/bin/supervisor-sink.js"]
          ports:
            - name: state
              containerPort: {{ .Values.service.internalPort }}
          env:
            - name: STATE_HTTP_PORT
              value: {{ .Values.service.internalPort | quote }}
            {{- include "scada.linkEnv" . | nindent 12 }}
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: state
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: state
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scada.prefix" . }}-supervisor-sink
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: supervisor-sink
spec:
  ports:
    - name: state
      port: {{ .Values.service.internalPort }}
      targetPort: state
  selector:
    {{- include "scada.match" (dict "app" "supervisor-sink" "ctx" .) | nindent 4 }}
{{- end }}
