{{- if .Values.rabbitmq.enabled }}
{{- if and .Values.rabbitmq.definitionsSecret .Values.rabbitmq.podTemplate }}
{{- fail "rabbitmq.definitionsSecret requires the managed pod template; unfreeze storage templates for the controlled migration restart" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scada.prefix" . }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: rabbitmq
spec:
  {{- $svc := .Values.rabbitmq.service | default dict }}
  type: {{ $svc.type | default "ClusterIP" }}
  ports:
    {{- range $entry := list (dict "name" "amqp" "port" 5672) (dict "name" "mqtt" "port" 1883) (dict "name" "stomp" "port" 61613) (dict "name" "management" "port" 15672) }}
    - name: {{ $entry.name }}
      port: {{ $entry.port }}
      targetPort: {{ ternary $entry.port $entry.name ($svc.numericTargetPorts | default false) }}
      {{- with get ($svc.nodePorts | default dict) $entry.name }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "scada.prefix" . }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: rabbitmq
    {{- with .Values.workloadLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: {{ include "scada.prefix" . }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 6 }}
  template:
    {{- if .Values.rabbitmq.podTemplate }}
    {{- toYaml .Values.rabbitmq.podTemplate | nindent 4 }}
    {{- else }}
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        {{- include "scada.match" (dict "app" "rabbitmq" "ctx" .) | nindent 8 }}
        {{- with .Values.workloadLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.rabbitmq.rolloutOnConfigChange .Values.rabbitmq.podAnnotations }}
      annotations:
        {{- with .Values.rabbitmq.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.rabbitmq.rolloutOnConfigChange }}
        checksum/config: {{ include (print $.Template.BasePath "/rabbitmq-config.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          {{- with .Values.rabbitmq.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: mqtt
              containerPort: 1883
            - name: stomp
              containerPort: 61613
            - name: management
              containerPort: 15672
          {{- with .Values.rabbitmq.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rabbitmq.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rabbitmq.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: {{ ternary "definitions" "config" (not (empty .Values.rabbitmq.definitionsSecret)) }}
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        {{- with .Values.rabbitmq.definitionsSecret }}
        - name: definitions
          secret:
            secretName: {{ . | quote }}
            items:
              - key: definitions.json
                path: definitions.json
        {{- end }}
        - name: config
          configMap:
            name: {{ include "scada.brokerConfigName" . }}
      {{- with .Values.rabbitmq.claimName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
      {{- end }}
    {{- end }}
  {{- if not .Values.rabbitmq.claimName }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "scada.claim" (dict "size" .Values.rabbitmq.storage "class" .Values.rabbitmq.storageClass) | nindent 8 }}
  {{- end }}
{{- if and .Values.rabbitmq.claimName .Values.rabbitmq.createClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.rabbitmq.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- include "scada.claim" (dict "size" .Values.rabbitmq.storage "class" .Values.rabbitmq.storageClass) | nindent 2 }}
{{- end }}
{{- end }}
