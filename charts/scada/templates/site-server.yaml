{{- if .Values.site.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scada.prefix" . }}-site-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "scada.match" (dict "app" "site-server" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        {{- include "scada.match" (dict "app" "site-server" "ctx" .) | nindent 8 }}
    spec:
      {{- with .Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: site-server
          image: {{ required "image is required" .Values.image | quote }}
          {{- with .Values.command }}
          command: {{ toJson . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: internal-api
              containerPort: {{ .Values.service.internalPort }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STATE_HTTP_PORT
              value: {{ .Values.service.internalPort | quote }}
            {{- include "scada.linkEnv" . | nindent 12 }}
            - name: SINK_PIPELINES
              value: "false"
            {{- if .Values.machines }}
            - name: EDGE_MACHINES
              value: {{ .Values.machines | toJson | quote }}
            {{- end }}
            {{- if .Values.sites }}
            - name: EDGE_SITES
              value: {{ .Values.sites | toJson | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/machines
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/machines
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scada.prefix" . }}-site-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: internal-api
      port: {{ .Values.service.internalPort }}
      targetPort: internal-api
  selector:
    {{- include "scada.match" (dict "app" "site-server" "ctx" .) | nindent 4 }}
{{- if gt (int .Values.service.nodePort) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scada.prefix" . }}-site-server-plant-lan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
  selector:
    {{- include "scada.match" (dict "app" "site-server" "ctx" .) | nindent 4 }}
{{- end }}
{{- end }}
