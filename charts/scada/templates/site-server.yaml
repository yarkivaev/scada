apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-site-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "scada.labels" . | nindent 8 }}
        app: site-server
    spec:
      {{- with .Values.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: site-server
          image: {{ required "image is required" .Values.image | quote }}
          {{- with .Values.command }}
          command: {{ toJson . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: internal-api
              containerPort: {{ .Values.service.internalPort }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STATE_HTTP_PORT
              value: {{ .Values.service.internalPort | quote }}
            - name: SINK_DB_PROFILE
              value: {{ .Values.role | quote }}
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secret }}
                  key: url
            - name: POSTGRES_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secret }}
                  key: adminUrl
            {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: STOMP_URL
              value: {{ printf "stomp://%s-rabbitmq:61613" .Release.Name | quote }}
            - name: STOMP_LOGIN
              value: guest
            - name: STOMP_PASSCODE
              value: guest
            - name: STOMP_HOST
              value: /
            - name: AMQP_URL
              value: {{ printf "amqp://guest:guest@%s-rabbitmq:5672" .Release.Name | quote }}
            {{- end }}
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_HOST
              value: {{ printf "%s-clickhouse" .Release.Name | quote }}
            - name: CLICKHOUSE_URL
              value: {{ printf "http://%s-clickhouse:8123" .Release.Name | quote }}
            {{- end }}
            {{- if .Values.machines }}
            - name: EDGE_MACHINES
              value: {{ .Values.machines | toJson | quote }}
            {{- end }}
            {{- if .Values.sites }}
            - name: EDGE_SITES
              value: {{ .Values.sites | toJson | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/machines
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/machines
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-site-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: internal-api
      port: {{ .Values.service.internalPort }}
      targetPort: internal-api
  selector:
    app: site-server
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if gt (int .Values.service.nodePort) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-site-server-plant-lan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scada.labels" . | nindent 4 }}
    app: site-server
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app: site-server
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
