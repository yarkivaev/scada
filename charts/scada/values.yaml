role: edge
# Override the resource name prefix when adopting an existing installation.
prefix: ""
createNamespace: false
site:
  enabled: true
sink:
  enabled: true
# Labels for workloads that must stay outside immutable selectors.
workloadLabels: {}
# Named deployments with command, env, optional resources and hostDevices.
processes: []
image: ""
command: []
pullSecret: ""
machines: []
sites: []
collectors: []
env: []
extraLabels: {}
service:
  port: 3000
  internalPort: 8081
  nodePort: 0
postgres:
  enabled: true
  image: postgres:16
  secret: scada-postgres
  database: scada
  storage: 10Gi
  storageClass: ""
  data: /var/lib/postgresql/data/pgdata
rabbitmq:
  enabled: true
  deadLetter: null
  # A named standalone PVC replaces the default volumeClaimTemplates when set.
  claimName: ""
  configName: ""
  rolloutOnConfigChange: false
  definitions: null
  plugins: [rabbitmq_stomp, rabbitmq_mqtt, rabbitmq_management]
  extraConfig: {}
  resources: {}
  readinessProbe: {}
  livenessProbe: {}
  image: rabbitmq:3.13-management
  storage: 5Gi
  storageClass: ""
  service:
    type: ClusterIP
clickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:24.8
  storage: 20Gi
  storageClass: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
