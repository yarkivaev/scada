role: edge
# Override the resource name prefix when adopting an existing installation.
prefix: ""
createNamespace: false
site:
  enabled: true
sink:
  enabled: true
# Labels for workloads that must stay outside immutable selectors.
workloadLabels: {}
# Named deployments with command, env, optional resources and hostDevices.
processes: []
# Raw Kubernetes manifests; template expressions are not evaluated.
extraObjects: []
image: ""
command: []
pullSecret: ""
machines: []
sites: []
collectors: []
env: []
# Kubernetes envFrom references for the site API.
envFrom: []
extraLabels: {}
service:
  port: 3000
  internalPort: 8081
  nodePort: 0
postgres:
  enabled: true
  image: postgres:16
  secret: scada-postgres
  # apply preserves startup migrations; verify uses a separately bootstrapped DB.
  migrationsMode: apply
  # Required and distinct from secret in verify mode; contains only runtime url.
  runtimeSecret: ""
  # Existing PVC: no PVC or volumeClaimTemplate is created.
  existingClaim: ""
  env: {}
  envFrom: []
  command: []
  args: []
  volumeMounts: []
  volumes: []
  readinessProbe: {}
  livenessProbe: {}
  startupProbe: {}
  resources: {}
  database: scada
  storage: 10Gi
  storageClass: ""
  data: /var/lib/postgresql/data/pgdata
rabbitmq:
  enabled: true
  deadLetter: null
  # A named standalone PVC replaces the default volumeClaimTemplates when set.
  claimName: ""
  createClaim: true
  podAnnotations: {}
  configName: ""
  rolloutOnConfigChange: false
  definitions: null
  # Secure definitions are provisioned separately; passwords never enter ConfigMaps.
  definitionsSecret: ""
  runtimeSecret: ""
  plugins: [rabbitmq_stomp, rabbitmq_mqtt, rabbitmq_management]
  extraConfig: {}
  resources: {}
  readinessProbe: {}
  livenessProbe: {}
  image: rabbitmq:3.13-management
  storage: 5Gi
  storageClass: ""
  service:
    type: ClusterIP
clickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:24.8
  storage: 20Gi
  storageClass: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
