name: Release

on:
  push:
    branches: [main]

jobs:
  check-version:
    uses: yarkivaev/npm-workflows/.github/workflows/check-version.yml@main

  lint:
    uses: yarkivaev/npm-workflows/.github/workflows/lint.yml@main
    with:
      node-version: '22'

  test:
    uses: yarkivaev/npm-workflows/.github/workflows/test.yml@main
    with:
      node-version: '22'

  control:
    uses: ./.github/workflows/control.yml

  supervisor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supervisor-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt test assembly

  tag:
    needs: [check-version, lint, test, control, supervisor]
    if: needs.check-version.outputs.should_release == 'true'
    uses: yarkivaev/npm-workflows/.github/workflows/tag.yml@main
    with:
      version: ${{ needs.check-version.outputs.version }}
    permissions:
      contents: write

  publish:
    needs: [tag]
    uses: yarkivaev/npm-workflows/.github/workflows/publish.yml@main
    with:
      node-version: '22'
    permissions:
      contents: read
      id-token: write
