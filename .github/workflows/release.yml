name: Release

on:
  push:
    branches: [main]

jobs:
  check-version:
    uses: yarkivaev/npm-workflows/.github/workflows/check-version.yml@main

  lint:
    uses: yarkivaev/npm-workflows/.github/workflows/lint.yml@main
    with:
      node-version: '22'

  test:
    uses: yarkivaev/npm-workflows/.github/workflows/test.yml@main
    with:
      node-version: '22'

  control:
    uses: ./.github/workflows/control.yml

  kiosk-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s test/kiosk -p 'test_*.py'
      - run: |
          for file in src/infrastructure/management/kiosk/*.sh; do bash -n "$file"; done
          node --input-type=module --check < src/infrastructure/management/kiosk/listen.mjs.txt

  stream-processing:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: history_test
          RABBITMQ_DEFAULT_PASS: history_test
        ports:
          - 61613/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scada_test
          POSTGRES_PASSWORD: scada_test
          POSTGRES_DB: scada_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U scada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: stream-processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U scada_test < ../db/migrations/E0018__stream_worker_checkpoint.sql
      - run: docker exec "${{ job.services.rabbitmq.id }}" rabbitmq-plugins enable rabbitmq_stomp
      - run: ./resolve-dependencies.sh
      - run: sbt test assembly
        env:
          PGUSER: scada_test
          PGPASSWORD: scada_test
          SCADA_HISTORY_TEST_STOMP_PORT: ${{ job.services.rabbitmq.ports['61613'] }}
          SCADA_HISTORY_TEST_STOMP_LOGIN: history_test
          SCADA_HISTORY_TEST_STOMP_PASSCODE: history_test
          SCADA_STREAM_WORKER_TEST_JDBC: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports['5432'] }}/scada_test

  tag:
    needs: [check-version, lint, test, control, kiosk-assets, stream-processing]
    if: needs.check-version.outputs.should_release == 'true'
    uses: yarkivaev/npm-workflows/.github/workflows/tag.yml@main
    with:
      version: ${{ needs.check-version.outputs.version }}
    permissions:
      contents: write

  publish:
    needs: [tag]
    uses: yarkivaev/npm-workflows/.github/workflows/publish.yml@main
    with:
      node-version: '22'
    permissions:
      contents: read
      id-token: write
