<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 410" width="1048" height="410" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, sans-serif">
  <title id="title">Replicated stream processing and durable historical correction</title>
  <desc id="description">A current writer and a standby share a PostgreSQL advisory lock per machine. The writer consumes a broker queue or polls durable history work. The state API validates a history commit and records the correction and cursor together.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0l8 4-8 4z" fill="#33313b" />
    </marker>
    <g id="server" fill="none" stroke="#33313b" stroke-width="1.8" stroke-linecap="round">
      <rect x="2" y="2" width="22" height="9" rx="2" />
      <rect x="2" y="15" width="22" height="9" rx="2" />
      <path d="M6 6.5h1m-1 13h1m5-13h8m-8 13h8" />
    </g>
    <g id="database" fill="none" stroke="#33313b" stroke-width="1.8" stroke-linecap="round">
      <ellipse cx="13" cy="6" rx="10" ry="4" />
      <path d="M3 6v14c0 5.3 20 5.3 20 0V6M3 13c0 5.3 20 5.3 20 0" />
    </g>
    <g id="queue" fill="none" stroke="#33313b" stroke-width="1.8" stroke-linecap="round">
      <rect x="2" y="3" width="22" height="20" rx="3" />
      <path d="M7 8h12M7 13h12M7 18h8" />
    </g>
  </defs>

  <rect x="1" y="1" width="1046" height="408" rx="18" fill="#fff" stroke="#e5e2e7" />
  <rect x="24" y="26" width="554" height="340" rx="16" fill="#fff4d2" stroke="#e5d8b2" />
  <rect x="640" y="26" width="384" height="340" rx="16" fill="#fff4d2" stroke="#e5d8b2" />
  <g fill="#33313b" font-size="19" font-weight="700">
    <text x="48" y="61">Stream Worker candidates</text>
    <text x="664" y="61">Input and durable state</text>
  </g>

  <g fill="none" stroke="#33313b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M270 122H299Q310 122 310 133V160Q310 171 321 171H334" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <path d="M270 278H299Q310 278 310 267V207Q310 196 321 196H334" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <path d="M662 107H596Q585 107 585 96V84Q585 74 575 74H168Q157 74 157 85V92" marker-end="url(#arrow)" />
    <path d="M270 141H279Q289 141 289 151V226Q289 237 301 237H654" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M814 239H835" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>

  <g stroke-width="1">
    <rect x="49" y="92" width="221" height="79" rx="10" fill="#ffe8a4" stroke="#eacb78" />
    <rect x="49" y="239" width="221" height="79" rx="10" fill="#fff" stroke="#e5d8b2" />
    <rect x="334" y="150" width="218" height="71" rx="10" fill="#fff" stroke="#e5d8b2" />
    <rect x="662" y="83" width="325" height="59" rx="10" fill="#fff" stroke="#e5d8b2" />
    <rect x="654" y="201" width="160" height="75" rx="10" fill="#fff" stroke="#e5d8b2" />
    <rect x="835" y="201" width="163" height="75" rx="10" fill="#fff" stroke="#e5d8b2" />
  </g>
  <use href="#server" x="62" y="114" />
  <use href="#server" x="62" y="261" />
  <use href="#database" x="347" y="170" />
  <use href="#queue" x="675" y="99" />
  <use href="#queue" x="666" y="222" />
  <use href="#database" x="846" y="222" />

  <g fill="#33313b" font-size="16" font-weight="700">
    <text x="100" y="124">Current writer</text>
    <text x="100" y="271">Standby</text>
    <text x="384" y="180">Writer lease</text>
    <text x="712" y="108">Per-machine broker queue</text>
    <text x="701" y="232">History API</text>
    <text x="881" y="232">PostgreSQL</text>
  </g>
  <g fill="#5e5865" font-size="13" font-weight="500">
    <text x="100" y="146">Processes one machine</text>
    <text x="100" y="293">Waits for ownership</text>
    <text x="384" y="199">Shared PostgreSQL lock</text>
    <text x="712" y="127">Rule-based classification input</text>
    <text x="701" y="251">Work and commit</text>
    <text x="881" y="251">Write progress</text>
    <text x="428" y="258">Durable historical correction</text>
    <text x="674" y="316">The state API validates the work token,</text>
    <text x="674" y="337">cursor and context revision at commit.</text>
    <text x="90" y="389">Writer election</text>
    <text x="255" y="389">Data and correction paths</text>
  </g>
  <path d="M49 385H76" fill="none" stroke="#33313b" stroke-width="2" stroke-dasharray="6 5" />
  <path d="M211 385H241" fill="none" stroke="#33313b" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="270" cy="122" r="5" fill="#33313b" stroke="#ffc61c" stroke-width="3.5" />
  <circle cx="270" cy="278" r="5" fill="#33313b" stroke="#ffc61c" stroke-width="3.5" />
</svg>
