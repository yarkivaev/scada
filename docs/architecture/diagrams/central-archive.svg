<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 426" width="1048" height="426" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="title">Edge sites with a central archive</title>
  <desc id="desc">Agents at two independent edge sites publish to their local ingest paths and send selected readings to a central RabbitMQ broker. Central ingestion writes ClickHouse and the central API queries it.</desc>
