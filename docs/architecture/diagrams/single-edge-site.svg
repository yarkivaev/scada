<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 456" width="1048" height="456" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, sans-serif">
  <title id="title">Single SCADA edge site</title>
  <desc id="desc">An agent reads equipment and publishes to RabbitMQ. The site server consumes MQTT and reads and writes PostgreSQL metrics. Supervisor reads telemetry and returns classified segments to RabbitMQ over STOMP. The state sink consumes STOMP and writes state to PostgreSQL. Plant clients query the site server.</desc>
